<!DOCTYPE html>
<html lang="cs" data-lang="cz">

<meta charset="utf-8">

<!--
  Standalone 404, served by Cloudflare for any unknown path (wrangler.toml: not_found_handling = "404-page").
  Deliberately not a Design Component: it can be served at any depth (/a/b/c), so every URL here is absolute,
  and it needs no runtime. Visual values mirror index.html / Nav.dc.html; the bands are a static port of
  Teal Hero Background.dc.html (teal #3E7B5A, 6 bands, drift 0.8).
-->
<script>(function(){var l='cz';try{if(localStorage.getItem('po-lang')==='en')l='en'}catch(e){}var d=document.documentElement;d.setAttribute('data-lang',l);d.lang=l==='en'?'en':'cs'})()</script>

<style>
:root{--ease:cubic-bezier(.65,0,.35,1);--ink:#16231B;--ink-cta:#17301F;--lime:#C8F169;--tile:#F3FBE4}
*{box-sizing:border-box}
html,body{margin:0;background:#F4F7F2;-webkit-font-smoothing:antialiased}
body{font-family:'Montserrat',system-ui,sans-serif;color:#FFFFFF}
::selection{background:var(--lime);color:var(--ink-cta)}
[data-lang="cz"] [data-l="en"],[data-lang="en"] [data-l="cz"]{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

.page{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(to bottom,#3E7B5A 0%,#8DB49C 50%,#DCE9E0 84%,#F4F7F2 100%)}
.bg{position:absolute;inset:0;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,#000 68%,transparent 100%);mask-image:linear-gradient(to bottom,#000 68%,transparent 100%)}
.bands{position:absolute;inset:0;transform:scaleX(-1);background:linear-gradient(to bottom,#3e7b5a 0%,#7ca58f 50%,#d8e5de 84%,#f6f9f8 100%)}
.band{position:absolute;inset:-120px;pointer-events:none}
.drift{position:absolute;inset:0;will-change:transform;animation:drift var(--d) ease-in-out var(--dl) infinite alternate}
.drift svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
@keyframes drift{from{transform:translate3d(calc(var(--a) * -1),0,0)}to{transform:translate3d(var(--a),0,0)}}
.scrim{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 60% at 50% 46%,rgba(20,60,40,.2),rgba(20,60,40,.07) 55%,rgba(20,60,40,0) 80%)}

.nav-wrap{position:relative;z-index:2;display:flex;justify-content:center;padding:40px 20px 0}
.nav{width:100%;max-width:1240px;height:88px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 32px;border-radius:10px;color:var(--ink);background:rgba(234,240,234,.46);-webkit-backdrop-filter:blur(26px) saturate(1.15);backdrop-filter:blur(26px) saturate(1.15);border:1px solid rgba(255,255,255,.55);box-shadow:0 10px 40px rgba(10,40,25,.10)}
.wordmark{color:var(--ink);font-weight:600;font-size:32px;letter-spacing:-.03em;white-space:nowrap;text-decoration:none}
.wordmark span{color:var(--lime)}
.lang{appearance:none;border:0;padding:4px 0;cursor:pointer;font:inherit;font-size:18px;font-weight:600;letter-spacing:.04em;color:var(--ink);opacity:.88;background:transparent linear-gradient(currentColor,currentColor) no-repeat 0 100%/0% 1px;transition:background-size .6s var(--ease),opacity .3s var(--ease)}
.lang:hover,.lang:focus-visible{opacity:1;background-size:100% 1px}

.main{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(32px,6vh,64px) 20px clamp(72px,14vh,140px)}
.code{margin:0;font-weight:600;font-size:clamp(120px,24vw,300px);line-height:.9;letter-spacing:-.05em;text-shadow:0 2px 32px rgba(15,50,30,.22)}
.title{margin:clamp(16px,3vh,28px) 0 0;max-width:1100px;font-weight:600;font-size:clamp(30px,min(4vw,7vh),56px);line-height:1.08;letter-spacing:-.025em;text-wrap:balance;text-shadow:0 2px 32px rgba(15,50,30,.22)}
.sub{margin:clamp(12px,2.4vh,20px) 0 0;max-width:720px;font-size:clamp(18px,min(2vw,3.6vh),24px);line-height:1.35;font-weight:500;letter-spacing:-.012em;text-wrap:pretty;text-shadow:0 1px 18px rgba(15,50,30,.25)}
.actions{margin-top:clamp(28px,5vh,44px);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:20px 32px}

/* Same build as the hero CTA in index.html: lime pill, pale tile that widens on hover, arrow turns 45°. */
.cta{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;height:72px;padding:0 34px 0 86px;border-radius:10px;background:var(--lime);color:var(--ink-cta);font-size:21px;font-weight:600;white-space:nowrap;text-decoration:none;transition:transform .3s var(--ease)}
.cta:active{transform:scale(.97)}
.cta:focus-visible{outline:2px solid var(--ink-cta);outline-offset:3px}
.cta__tile{position:absolute;z-index:-1;left:8px;top:8px;bottom:8px;width:56px;border-radius:6px;background:var(--tile);transition:width .6s var(--ease)}
.cta__icon{position:absolute;left:8px;top:8px;width:56px;height:56px;display:flex;align-items:center;justify-content:center}
.cta__icon svg{display:block;transition:transform .6s var(--ease)}
.cta__label{display:block;transition:transform .6s var(--ease)}
.cta:hover .cta__tile,.cta:focus-visible .cta__tile{width:calc(100% - 16px)}
.cta:hover .cta__icon svg,.cta:focus-visible .cta__icon svg{transform:rotate(45deg)}
.cta:hover .cta__label,.cta:focus-visible .cta__label{transform:translateX(4px)}

.link{font-size:18px;font-weight:600;color:var(--ink-cta);text-decoration:none;padding:4px 0;background:linear-gradient(currentColor,currentColor) no-repeat 0 100%/0% 1px;transition:background-size .6s var(--ease)}
.link:hover,.link:focus-visible{background-size:100% 1px}

@media (max-width:560px){
  .nav-wrap{padding:24px 16px 0}
  .nav{height:72px;padding:0 24px}
  .wordmark{font-size:28px}
  .main{padding-left:16px;padding-right:16px}
  .actions{flex-direction:column}
  .cta{height:64px;padding:0 28px 0 76px;font-size:18px}
  .cta__tile{width:48px}
  .cta__icon{width:48px;height:48px}
}
@media (prefers-reduced-motion:reduce){
  .drift{animation:none}
  .cta,.cta__tile,.cta__icon svg,.cta__label,.lang,.link{transition:none}
}
</style>
</head>
