<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>@keyframes poPulse{0%{transform:scale(1);opacity:.55}80%,100%{transform:scale(3);opacity:0}}</style>
<script src="./solar-icon.js"></script>
</helmet>
<header style="position:relative;padding:40px 20px 0;display:flex;justify-content:center;font-family:'Montserrat',system-ui,sans-serif">
  <nav style="width:100%;max-width:1240px;border-radius:10px;color:#16231B;background:rgba(234,240,234,0.46);backdrop-filter:blur(26px) saturate(1.15);-webkit-backdrop-filter:blur(26px) saturate(1.15);border:1px solid rgba(255,255,255,0.55);box-shadow:0 10px 40px rgba(10,40,25,0.10)">
    <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;height:88px;padding:0 16px 0 32px">
      <a href="./" style="justify-self:start;color:#16231B;font-weight:600;font-size:32px;letter-spacing:-0.03em;white-space:nowrap;text-decoration:none">Pavel<span style="color:#C8F169">.</span></a>
      <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;align-items:center;gap:44px;font-size:19px;font-weight:600">
          <sc-for list="{{ links }}" as="link" hint-placeholder-count="4">
            <a href="{{ link.href }}" aria-current="{{ link.ariaCurrent }}" style="position:relative;color:#16231B;opacity:{{ link.opacity }};white-space:nowrap;text-decoration:none;padding:4px 0;background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;background-position:0 100%;background-size:0% 1px;transition:background-size .6s cubic-bezier(.65,0,.35,1),opacity .3s cubic-bezier(.65,0,.35,1)" style-hover="opacity:1;background-size:100% 1px">
              {{ link.label }}
              <sc-if value="{{ link.dot }}" hint-placeholder-val="{{ false }}">{{ dot }}</sc-if>
            </a>
          </sc-for>
        </div>
      </sc-if>
      <div style="grid-column:3;justify-self:end;display:flex;align-items:center;gap:28px">
        <sc-if value="{{ langDropdown }}" hint-placeholder-val="{{ true }}">
          <div onMouseEnter="{{ openLangMenu }}" onMouseLeave="{{ closeLangMenu }}" style="position:relative;font-size:18px;font-weight:600;letter-spacing:0.04em">
            <button onClick="{{ toggleLangMenu }}" aria-haspopup="listbox" aria-expanded="{{ langMenuOpen }}" aria-label="Language" style="appearance:none;border:0;padding:4px 0;display:flex;align-items:center;gap:6px;cursor:pointer;font:inherit;color:#16231B;opacity:0.88;background-color:transparent;background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;background-position:0 100%;background-size:0% 1px;transition:background-size .6s cubic-bezier(.65,0,.35,1),opacity .3s cubic-bezier(.65,0,.35,1)" style-hover="opacity:1;background-size:100% 1px">{{ langCode }}<solar-icon icon="alt-arrow-down-broken" size="16" style="display:block;transform:{{ langChevT }};transition:transform .3s cubic-bezier(.65,0,.35,1)"></solar-icon></button>
            <sc-if value="{{ langMenuOpen }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;top:100%;right:-8px;padding-top:10px"><div role="listbox" style="position:relative;min-width:132px;padding:6px;background:#FFFFFF;border:1px solid rgba(22,35,27,0.12);border-radius:3px;box-shadow:0 14px 34px rgba(10,40,25,0.14);display:flex;flex-direction:column;gap:2px;letter-spacing:0">
                <button onClick="{{ pickCz }}" role="option" aria-selected="{{ isCz }}" style="appearance:none;border:0;background:{{ czItemBg }};padding:9px 10px;border-radius:2px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;font:inherit;font-size:16px;font-weight:500;color:#16231B;text-align:left" style-hover="background:#EAF0EA">Čeština<span style="font-size:14px;font-weight:600;letter-spacing:0.04em;opacity:0.45">CZ</span></button>
                <button onClick="{{ pickEn }}" role="option" aria-selected="{{ isEn }}" style="appearance:none;border:0;background:{{ enItemBg }};padding:9px 10px;border-radius:2px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;font:inherit;font-size:16px;font-weight:500;color:#16231B;text-align:left" style-hover="background:#EAF0EA">English<span style="font-size:14px;font-weight:600;letter-spacing:0.04em;opacity:0.45">EN</span></button>
              </div></div>
            </sc-if>
          </div>
        </sc-if>
        <sc-if value="{{ langSlide }}" hint-placeholder-val="{{ false }}">
          <div role="group" aria-label="Language" style="position:relative;display:flex;gap:8px;padding-bottom:6px;text-align:center;font-size:18px;font-weight:600;letter-spacing:0.04em">
            <button onClick="{{ setCz }}" aria-pressed="{{ isCz }}" style="appearance:none;border:0;background:none;width:28px;padding:4px 0;cursor:pointer;font:inherit;color:#16231B;opacity:{{ czOpacity }};background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;background-position:0 100%;background-size:0% 1px;transition:background-size .6s cubic-bezier(.65,0,.35,1),opacity .3s cubic-bezier(.65,0,.35,1)" style-hover="opacity:1;background-size:100% 1px">CZ</button>
            <button onClick="{{ setEn }}" aria-pressed="{{ isEn }}" style="appearance:none;border:0;background:none;width:28px;padding:4px 0;cursor:pointer;font:inherit;color:#16231B;opacity:{{ enOpacity }};background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;background-position:0 100%;background-size:0% 1px;transition:background-size .6s cubic-bezier(.65,0,.35,1),opacity .3s cubic-bezier(.65,0,.35,1)" style-hover="opacity:1;background-size:100% 1px">EN</button>
            <span style="position:absolute;left:11.5px;bottom:0;width:5px;height:5px;border-radius:50%;background:#4F7A16;transform:{{ langDotT }};transition:transform .6s cubic-bezier(.65,0,.35,1)"></span>
          </div>
        </sc-if>
        <sc-if value="{{ langSingle }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ toggleLang }}" aria-label="{{ otherLangLabel }}" style="appearance:none;border:0;padding:4px 0;cursor:pointer;font:inherit;font-size:18px;font-weight:600;letter-spacing:0.04em;color:#16231B;opacity:0.88;background-color:transparent;background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;background-position:0 100%;background-size:0% 1px;transition:background-size .6s cubic-bezier(.65,0,.35,1)" style-hover="opacity:1;background-size:100% 1px">{{ otherLang }}</button>
        </sc-if>
        <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
          <a href="{{ ctaHref }}" onMouseEnter="{{ navCtaOn }}" onMouseLeave="{{ navCtaOff }}" style="position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;height:56px;padding:0 24px 0 66px;border-radius:8px;background:#C8F169;color:#17301F;font-size:18px;font-weight:600;white-space:nowrap;text-decoration:none;transition:transform .3s cubic-bezier(.65,0,.35,1)" style-active="transform:scale(0.97)">
            <span style="position:absolute;z-index:-1;left:6px;top:6px;bottom:6px;width:{{ navTileW }};border-radius:5px;background:#F3FBE4;transition:width .6s cubic-bezier(.65,0,.35,1)"></span>
            <span style="position:absolute;left:6px;top:6px;width:44px;height:44px;display:flex;align-items:center;justify-content:center"><solar-icon icon="arrow-right-up-broken" size="22" style="display:block;transform:{{ navArrowT }};transition:transform .6s cubic-bezier(.65,0,.35,1)"></solar-icon></span>
            <span style="display:block;transform:{{ navLabelT }};transition:transform .6s cubic-bezier(.65,0,.35,1)">{{ cta }}</span>
          </a>
        </sc-if>
        <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ toggleMenu }}" aria-label="Menu" aria-expanded="{{ menuOpen }}" style="position:relative;appearance:none;width:44px;height:44px;border-radius:7px;border:1px solid rgba(22,35,27,0.18);background:rgba(255,255,255,0.4);color:#16231B;display:flex;align-items:center;justify-content:center;cursor:pointer">
            <solar-icon icon="hamburger-menu-broken" size="22" style="display:block"></solar-icon>
            <sc-if value="{{ showWorkDot }}" hint-placeholder-val="{{ false }}">{{ dotCorner }}</sc-if>
          </button>
        </sc-if>
      </div>
    </div>
    <sc-if value="{{ showMenu }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;gap:4px;padding:4px 10px 12px;border-top:1px solid rgba(22,35,27,0.12)">
        <sc-for list="{{ links }}" as="link" hint-placeholder-count="4">
          <a href="{{ link.href }}" onClick="{{ closeMenu }}" aria-current="{{ link.ariaCurrent }}" style="color:#16231B;display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;font-size:19px;font-weight:500;text-decoration:none">
            <span style="position:relative">{{ link.label }}<sc-if value="{{ link.dot }}" hint-placeholder-val="{{ false }}">{{ dot }}</sc-if></span>
          </a>
        </sc-for>
        <a href="{{ ctaHref }}" onClick="{{ closeMenu }}" onMouseEnter="{{ navCtaOn }}" onMouseLeave="{{ navCtaOff }}" style="position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;height:56px;margin-top:6px;padding:0 24px 0 66px;border-radius:8px;background:#C8F169;color:#17301F;font-size:18px;font-weight:600;white-space:nowrap;text-decoration:none;transition:transform .3s cubic-bezier(.65,0,.35,1)" style-active="transform:scale(0.97)">
          <span style="position:absolute;z-index:-1;left:6px;top:6px;bottom:6px;width:{{ navTileW }};border-radius:5px;background:#F3FBE4;transition:width .6s cubic-bezier(.65,0,.35,1)"></span>
          <span style="position:absolute;left:6px;top:6px;width:44px;height:44px;display:flex;align-items:center;justify-content:center"><solar-icon icon="arrow-right-up-broken" size="22" style="display:block;transform:{{ navArrowT }};transition:transform .6s cubic-bezier(.65,0,.35,1)"></solar-icon></span>
          <span style="display:block;transform:{{ navLabelT }};transition:transform .6s cubic-bezier(.65,0,.35,1)">{{ cta }}</span>
        </a>
      </div>
    </sc-if>
  </nav>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:120},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;work&quot;,&quot;about&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;'home' | 'work' | 'about' | 'contact'&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cz&quot;,&quot;en&quot;],&quot;default&quot;:&quot;cz&quot;,&quot;tsType&quot;:&quot;'cz' | 'en'&quot;},&quot;onLang&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(lang: 'cz' | 'en') =&gt; void&quot;},&quot;langStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dropdown&quot;,&quot;slide&quot;,&quot;single&quot;],&quot;default&quot;:&quot;single&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  static COPY = {
    cz: { links: ['Práce', 'Služby', 'O mně', 'Kontakt'], cta: 'Domluvit hovor' },
    en: { links: ['Work', 'Services', 'About', 'Contact'], cta: 'Book a call' }
  };
  static PAGES = [
    { key: 'work', href: 'Hero.dc.html#work' },
    { key: 'services', href: 'Hero.dc.html#services' },
    { key: 'about', href: 'Hero.dc.html#about' },
    { key: 'contact', href: 'Hero.dc.html#contact' }
  ];

  state = { mobile: false, menuOpen: false, langMenuOpen: false };

  componentDidMount() {
    this.mq = matchMedia('(max-width: 1200px)');
    this.onMq = () => this.setState({ mobile: this.mq.matches, menuOpen: false });
    this.mq.addEventListener('change', this.onMq);
    this.onMq();
    this.reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.onDoc = e => { if (this.state.langMenuOpen && !e.target.closest('[aria-haspopup="listbox"], [role="listbox"]')) this.setState({ langMenuOpen: false }); };
    document.addEventListener('pointerdown', this.onDoc);
  }
  componentWillUnmount() { this.mq && this.mq.removeEventListener('change', this.onMq); document.removeEventListener('pointerdown', this.onDoc); }

  makeDot(pos) {
    const red = '#E5484D';
    const e = React.createElement;
    return e('span', { 'aria-hidden': true, style: { position: 'absolute', width: 7, height: 7, ...pos } },
      this.reduce ? null : e('span', { style: { position: 'absolute', inset: 0, borderRadius: '50%', background: red, animation: 'poPulse 2.2s cubic-bezier(.2,.6,.3,1) infinite' } }),
      e('span', { style: { position: 'absolute', inset: 0, borderRadius: '50%', background: red } })
    );
  }

  renderVals() {
    const lang = this.props.lang ?? 'cz';
    const current = this.props.current ?? 'home';
    const cz = lang === 'cz';
    const { mobile, menuOpen } = this.state;
    const copy = Component.COPY[lang];
    const setLang = l => this.props.onLang && this.props.onLang(l);
    const links = Component.PAGES.map((p, i) => ({
      label: copy.links[i],
      href: current === 'home' && p.href.startsWith('Hero.dc.html#') ? p.href.slice(12) : p.href,
      dot: p.key === 'work' && current !== 'work',
      opacity: current === p.key ? 1 : 0.88,
      ariaCurrent: current === p.key ? 'page' : undefined
    }));
    return {
      links,
      cta: copy.cta,
      dot: this.makeDot({ top: 1, right: -8 }),
      dotCorner: this.makeDot({ top: 6, right: 6 }),
      ctaHref: current === 'home' ? '#contact' : 'Hero.dc.html#contact',
      showWorkDot: current !== 'work' && !menuOpen,
      isCz: cz, isEn: !cz,
      czOpacity: cz ? 1 : 0.4,
      enOpacity: cz ? 0.4 : 1,
      czBg: cz ? '#FFFFFF' : 'transparent',
      enBg: cz ? 'transparent' : '#FFFFFF',
      czShadow: cz ? '0 1px 3px rgba(22,35,27,0.12)' : 'none',
      enShadow: cz ? 'none' : '0 1px 3px rgba(22,35,27,0.12)',
      setCz: () => setLang('cz'),
      setEn: () => setLang('en'),
      isDesktop: !mobile,
      navCtaOn: () => this.setState({ ctaHover: true }),
      navCtaOff: () => this.setState({ ctaHover: false }),
      navTileW: this.state.ctaHover ? 'calc(100% - 12px)' : '44px',
      navArrowT: this.state.ctaHover ? 'rotate(45deg)' : 'rotate(0deg)',
      navLabelT: this.state.ctaHover ? 'translateX(4px)' : 'translateX(0)',
      navChipBg: this.state.ctaHover ? '#D6F58C' : '#C8F169',
      navChipFg: '#17301F',
      langDropdown: this.props.langStyle === 'dropdown',
      langSlide: this.props.langStyle === 'slide',
      langSingle: (this.props.langStyle ?? 'single') === 'single',
      langCode: cz ? 'CZ' : 'EN',
      langMenuOpen: this.state.langMenuOpen,
      langChevT: this.state.langMenuOpen ? 'rotate(180deg)' : 'rotate(0deg)',
      toggleLangMenu: () => this.setState(s => ({ langMenuOpen: !s.langMenuOpen })),
      openLangMenu: () => { clearTimeout(this.langT); this.setState({ langMenuOpen: true }); },
      closeLangMenu: () => { clearTimeout(this.langT); this.langT = setTimeout(() => this.setState({ langMenuOpen: false }), 120); },
      pickCz: () => { setLang('cz'); this.setState({ langMenuOpen: false }); },
      pickEn: () => { setLang('en'); this.setState({ langMenuOpen: false }); },
      czItemBg: cz ? '#EAF0EA' : 'transparent',
      enItemBg: cz ? 'transparent' : '#EAF0EA',
      langDotT: cz ? 'translateX(0)' : 'translateX(36px)',
      otherLang: cz ? 'EN' : 'CZ',
      otherLangLabel: cz ? 'Switch to English' : 'Přepnout do češtiny',
      toggleLang: () => setLang(cz ? 'en' : 'cz'),
      isMobile: mobile,
      menuOpen,
      showMenu: mobile && menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => { if (this.state.menuOpen) this.setState({ menuOpen: false }); }
    };
  }
}
</script>
</body>
</html>
