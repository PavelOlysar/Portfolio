<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>html,body{margin:0;height:100%;background:#E9F4F4}a{color:#1F7A7D}a:hover{color:#165A5C}</style></helmet>
<div ref="{{ rootRef }}" aria-hidden="true" style="position:relative;width:100%;height:100vh;overflow:hidden;isolation:isolate;background:linear-gradient(to bottom,#1F7A7D 0%,#79B0B1 50%,#D9EBEB 84%,#F4FAFA 100%)"></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;teal&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#F08A3C&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#E07A2E&quot;,&quot;#FF4F1F&quot;,&quot;#F26A21&quot;,&quot;#E8622A&quot;,&quot;#D2691E&quot;,&quot;#C05A1A&quot;,&quot;#A84B16&quot;,&quot;#F08A3C&quot;]},&quot;bandCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:6,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:2,&quot;max&quot;:9},&quot;driftSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.75,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0.25,&quot;max&quot;:3,&quot;step&quot;:0.05,&quot;unit&quot;:&quot;×&quot;},&quot;parallaxStrength&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:30,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:80,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;},&quot;shimmer&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;grain&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05},&quot;faceRight&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  // ── Defaults (Tweaks props override these) ──────────────────────────
  static CONFIG = {
    teal: '#1F7A7D',      // single hue; all tints derived from it
    bandCount: 5,
    driftSpeed: 1,        // multiplier: 1 = 20–40s loops, 2 = twice as fast
    parallaxStrength: 30, // px max shift of the front band
    shimmer: true,
    grain: 0.6,           // 0–1
    faceRight: true       // mirror so curves face right
  };

  rootRef = React.createRef();
  anims = [];
  layers = [];
  tx = 0; ty = 0; gx = 0; gy = 0; raf = 0;

  cfg() {
    const C = Component.CONFIG, p = this.props;
    return {
      teal: p.teal ?? C.teal,
      bandCount: Math.max(1, Math.round(p.bandCount ?? C.bandCount)),
      driftSpeed: Math.max(0.05, p.driftSpeed ?? C.driftSpeed),
      parallaxStrength: p.parallaxStrength ?? C.parallaxStrength,
      shimmer: p.shimmer ?? C.shimmer,
      grain: p.grain ?? C.grain,
      faceRight: p.faceRight ?? C.faceRight
    };
  }

  componentDidMount() {
    this.onVis = () => (document.hidden ? this.pause() : this.resume());
    this.onMove = (e) => {
      this.gx = (e.clientX / innerWidth - 0.5) * 2;
      this.gy = (e.clientY / innerHeight - 0.5) * 2;
      this.kick();
    };
    document.addEventListener('visibilitychange', this.onVis);
    this.build();
  }
  componentDidUpdate(prev) {
    if (['teal', 'bandCount', 'driftSpeed', 'parallaxStrength', 'shimmer', 'grain', 'faceRight'].some(k => prev[k] !== this.props[k])) this.build();
  }
  componentWillUnmount() {
    this.teardown();
    document.removeEventListener('visibilitychange', this.onVis);
  }

  teardown() {
    this.anims.forEach(a => a.cancel());
    this.anims = []; this.layers = [];
    cancelAnimationFrame(this.raf); this.raf = 0;
    window.removeEventListener('pointermove', this.onMove);
  }
  pause() { this.anims.forEach(a => a.pause()); cancelAnimationFrame(this.raf); this.raf = 0; }
  resume() { this.anims.forEach(a => a.play()); this.kick(); }

  kick() {
    if (this.raf || !this.parallaxOn || document.hidden) return;
    const step = () => {
      this.tx += (this.gx - this.tx) * 0.05;
      this.ty += (this.gy - this.ty) * 0.05;
      const n = this.layers.length, s = this.strength, fx = this.flip ? -1 : 1;
      this.layers.forEach((el, i) => {
        const d = 0.25 + 0.75 * (n > 1 ? i / (n - 1) : 1);
        el.style.transform = `translate3d(${(-this.tx * s * d * fx).toFixed(2)}px,${(-this.ty * s * d * 0.4).toFixed(2)}px,0)`;
      });
      this.raf = Math.abs(this.gx - this.tx) + Math.abs(this.gy - this.ty) > 0.0005 ? requestAnimationFrame(step) : 0;
    };
    this.raf = requestAnimationFrame(step);
  }

  build() {
    this.teardown();
    const root = this.rootRef.current;
    if (!root) return;
    if (this.props.fillParent) root.style.height = '100%';
    root.innerHTML = '';
    const c = this.cfg();
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.parallaxOn = !reduce && matchMedia('(hover: hover) and (pointer: fine)').matches && c.parallaxStrength > 0;
    this.strength = c.parallaxStrength;
    this.flip = c.faceRight;
    root.style.transform = c.faceRight ? 'scaleX(-1)' : '';

    // colour helpers (single hue)
    const hex = c.teal.replace('#', '');
    const rgb = [0, 2, 4].map(o => parseInt(hex.substr(o, 2), 16));
    const mix = t => '#' + rgb.map(v => Math.round(v + (255 - v) * t).toString(16).padStart(2, '0')).join('');
    const [r, g, b] = rgb.map(v => v / 255), mx = Math.max(r, g, b), mn = Math.min(r, g, b), L = (mx + mn) / 2;
    let h = 0, S = 0;
    if (mx !== mn) {
      const d = mx - mn; S = L > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60;
    }
    const bright = `hsl(${h.toFixed(0)},${Math.min(100, S * 125).toFixed(0)}%,66%)`;
    const shadow = `hsl(${h.toFixed(0)},${(S * 100).toFixed(0)}%,${(L * 60).toFixed(0)}%)`;
    const fillStops = k => [[0, mix(0 + k)], [0.5, mix(0.32 + k)], [0.84, mix(0.8 + k * 0.5)], [1, mix(0.955)]];
    root.style.background = 'linear-gradient(to bottom,' + fillStops(0).map(([o, col]) => `${col} ${o * 100}%`).join(',') + ')';

    const W = 1600, H = 1000, n = c.bandCount, R = 1.75 * H, cy = 1.08 * H;
    const spacing = (W + 120) / n, uid = Math.random().toString(36).slice(2, 7);
    const stopsXml = s => s.map(([o, col, op]) => `<stop offset="${o}" stop-color="${col}"${op != null ? ` stop-opacity="${op}"` : ''}/>`).join('');

    for (let i = 0; i < n; i++) {
      const cx = -260 + i * spacing + R, id = `${uid}${i}`, t = n > 1 ? i / (n - 1) : 1;
      const circ = a => `<circle cx="${cx}" cy="${cy}" r="${R}" ${a}/>`;
      const svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible">
<defs>
<linearGradient id="f${id}" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="${H}">${stopsXml(fillStops(i * 0.012))}</linearGradient>
<linearGradient id="e${id}" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="${H}">${stopsXml([[0, bright], [0.45, mix(0.7)], [1, '#ffffff', 0.9]])}</linearGradient>
<radialGradient id="q${id}" gradientUnits="userSpaceOnUse" cx="${c.faceRight ? W - 620 : 620}" cy="400" r="880">${stopsXml([[0, '#3a3a3a'], [0.55, '#8a8a8a'], [1, '#ffffff']])}</radialGradient>
<mask id="m${id}" maskUnits="userSpaceOnUse" x="-800" y="-800" width="${W + 1600}" height="${H + 1600}"><rect x="-800" y="-800" width="${W + 1600}" height="${H + 1600}" fill="url(#q${id})"/></mask>
<clipPath id="c${id}">${circ('')}</clipPath>
<filter id="s${id}" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="22"/></filter>
<filter id="i${id}" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="28"/></filter>
<filter id="g${id}" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="7"/></filter>
<filter id="l${id}" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="0.9"/></filter>
</defs>
<g mask="url(#m${id})">${circ(`fill="none" stroke="${shadow}" stroke-width="50" opacity="0.3" filter="url(#s${id})" transform="translate(-14 0)"`)}</g>
${circ(`fill="url(#f${id})"`)}
<g clip-path="url(#c${id})">${circ(`fill="none" stroke="#ffffff" stroke-width="80" opacity="0.2" filter="url(#i${id})"`)}</g>
<g mask="url(#m${id})">
${circ(`fill="none" stroke="url(#e${id})" stroke-width="12" opacity="0.5" filter="url(#g${id})"`)}
${circ(`fill="none" stroke="url(#e${id})" stroke-width="2.2" opacity="0.95" filter="url(#l${id})"`)}
</g></svg>`;

      const layer = document.createElement('div');
      layer.style.cssText = 'position:absolute;inset:-120px;will-change:transform;pointer-events:none';
      const drift = document.createElement('div');
      drift.style.cssText = 'position:absolute;inset:0;will-change:transform';
      drift.innerHTML = svg;

      if (c.shimmer && !reduce) {
        const m = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice"><filter id="b" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3"/></filter><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#fff" stroke-width="13" filter="url(#b)"/></svg>`;
        const url = `url("data:image/svg+xml,${encodeURIComponent(m)}")`;
        const sh = document.createElement('div');
        sh.style.cssText = `position:absolute;inset:0;overflow:hidden;-webkit-mask-image:${url};mask-image:${url};-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat`;
        const spot = document.createElement('div');
        spot.style.cssText = 'position:absolute;left:0;right:0;top:0;height:28%;opacity:0;will-change:transform,opacity;background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,255,255,1),rgba(255,255,255,0))';
        sh.appendChild(spot);
        drift.appendChild(sh);
        const dur = (15 + (i * 3.7) % 7) * 1000 / c.driftSpeed;
        this.anims.push(spot.animate([
          { transform: 'translate3d(0,-110%,0)', opacity: 0 },
          { opacity: 1, offset: 0.35 },
          { opacity: 1, offset: 0.65 },
          { transform: 'translate3d(0,380%,0)', opacity: 0 }
        ], { duration: dur, iterations: Infinity, easing: 'ease-in-out', delay: -((i * 0.37) % 1) * dur }));
      }

      layer.appendChild(drift);
      root.appendChild(layer);
      this.layers.push(layer);

      if (!reduce) {
        const amp = 20 + 40 * t;
        const period = (20 + ((i * 7.7 + 3) % 20)) * 1000 / c.driftSpeed;
        this.anims.push(drift.animate(
          [{ transform: `translate3d(${-amp}px,0,0)` }, { transform: `translate3d(${amp}px,0,0)` }],
          { duration: period / 2, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out', delay: -Math.random() * period }
        ));
      }
    }

    // static film grain
    if (c.grain > 0) {
      const S2 = 180, cv = document.createElement('canvas');
      cv.width = cv.height = S2;
      const ctx = cv.getContext('2d'), img = ctx.createImageData(S2, S2);
      for (let p = 0; p < img.data.length; p += 4) {
        const v = Math.random() < 0.5 ? 0 : 255;
        img.data[p] = img.data[p + 1] = img.data[p + 2] = v;
        img.data[p + 3] = Math.random() * 46;
      }
      ctx.putImageData(img, 0, 0);
      const gr = document.createElement('div');
      gr.style.cssText = `position:absolute;inset:0;pointer-events:none;background-image:url(${cv.toDataURL()});background-size:${S2}px ${S2}px;opacity:${Math.min(1, c.grain)}`;
      root.appendChild(gr);
    }

    if (this.parallaxOn) window.addEventListener('pointermove', this.onMove, { passive: true });
    if (document.hidden) this.pause();
  }

  renderVals() {
    return { rootRef: this.rootRef };
  }
}
</script>
</body>
</html>
